<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>13 Years — a GTA 6 meme for make.fun</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; }
  body {
    background: #0d0618;
    font-family: "DejaVu Sans", "Arial Black", Arial, sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .cap {
    text-align: center; font-weight: 900; color: #ffffff;
    letter-spacing: 1px; line-height: 1.12;
    text-shadow: 0 4px 0 #000, 0 0 22px rgba(255,46,166,.25);
  }
  .cap-top { font-size: 63px; padding: 30px 24px 14px; }
  .cap-top .yrs { color: #ffb03a; }
  .scene { flex: 1 1 auto; position: relative; }
  .scene svg { display: block; width: 1024px; height: 100%; }
  .cap-bot { padding: 16px 24px 30px; }
  .cap-bot .l1 { font-size: 47px; }
  .cap-bot .l2 { font-size: 47px; }
  .cap-bot .brand { color: #ff2ea6; font-size: 88px; line-height: 1.05; }
</style>
</head>
<body>
  <div class="cap cap-top">WAITED <span class="yrs">13 YEARS</span> FOR GTA 6</div>

  <div class="scene">
  <svg viewBox="0 0 1024 548" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2a1650"/>
        <stop offset="1" stop-color="#170b30"/>
      </linearGradient>
      <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffd23e"/>
        <stop offset="0.45" stop-color="#ff7a3d"/>
        <stop offset="0.78" stop-color="#ff2e88"/>
        <stop offset="1" stop-color="#7b2ff7"/>
      </linearGradient>
    </defs>

    <!-- wall and floor -->
    <rect x="0" y="0" width="1024" height="548" fill="url(#wall)"/>
    <rect x="0" y="470" width="1024" height="78" fill="#0a0516"/>

    <!-- TV with the game on -->
    <rect x="56" y="52" width="540" height="308" rx="18" fill="#05060a"/>
    <rect x="72" y="68" width="508" height="276" rx="10" fill="url(#sunset)"/>
    <circle cx="470" cy="150" r="42" fill="#fff3b0" opacity="0.9"/>
    <!-- palm silhouettes -->
    <g stroke="#1c0b2e" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M150 344 q-6 -48 -2 -92"/>
      <path d="M148 252 q-22 -18 -42 -18"/>
      <path d="M148 252 q-12 -26 -32 -34"/>
      <path d="M148 252 q2 -28 16 -42"/>
      <path d="M148 252 q18 -20 38 -22"/>
      <path d="M148 252 q24 -8 40 2"/>
      <path d="M520 344 q4 -38 0 -72"/>
      <path d="M520 272 q-18 -14 -34 -14"/>
      <path d="M520 272 q-8 -22 -26 -28"/>
      <path d="M520 272 q4 -22 16 -32"/>
      <path d="M520 272 q16 -14 32 -14"/>
    </g>
    <text x="326" y="212" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="900" font-size="86" fill="#ffffff" stroke="#000" stroke-width="3" paint-order="stroke">GTA VI</text>
    <text x="326" y="252" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="900" font-size="30" letter-spacing="8" fill="#ffffff">VICE CITY</text>
    <rect x="290" y="360" width="72" height="16" fill="#05060a"/>

    <!-- couch -->
    <rect x="86" y="392" width="392" height="88" rx="26" fill="#0e5f56"/>
    <rect x="70" y="452" width="424" height="66" rx="24" fill="#0a4a43"/>

    <!-- the human, 13 years older, controller in hand -->
    <g transform="translate(-30 16)">
      <rect x="238" y="330" width="92" height="96" rx="26" fill="#475569"/>
      <circle cx="284" cy="292" r="52" fill="#f2c094"/>
      <path d="M240 272 a50 50 0 0 1 88 0" fill="none" stroke="#cfd4da" stroke-width="15" stroke-linecap="round"/>
      <path d="M242 318 q42 38 84 0 q-4 44 -42 44 q-38 0 -42 -44z" fill="#cfd4da"/>
      <circle cx="264" cy="290" r="5.5" fill="#14100c"/>
      <circle cx="304" cy="290" r="5.5" fill="#14100c"/>
      <rect x="212" y="392" width="52" height="20" rx="10" fill="#f2c094" transform="rotate(24 238 402)"/>
      <rect x="304" y="392" width="52" height="20" rx="10" fill="#f2c094" transform="rotate(-24 330 402)"/>
      <rect x="252" y="398" width="64" height="30" rx="14" fill="#14100c"/>
      <circle cx="268" cy="413" r="5" fill="#ff2e88"/>
      <circle cx="300" cy="413" r="5" fill="#37e0a0"/>
      <rect x="240" y="470" width="34" height="48" rx="10" fill="#26324a"/>
      <rect x="294" y="470" width="34" height="48" rx="10" fill="#26324a"/>
    </g>

    <!-- make.fun ghost mascot, floating in with its star coin -->
    <g transform="translate(655 100) scale(1.12)">
      <path d="M-58 66 L-58 -8 A58 58 0 0 1 58 -8 L58 66 L43 50 L29 66 L14 50 L0 66 L-14 50 L-29 66 L-43 50 Z"
            fill="#ffffff" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
      <polygon points="0,-13 3.5,-3.5 13,0 3.5,3.5 0,13 -3.5,3.5 -13,0 -3.5,-3.5" transform="translate(-24 -6)" fill="#000"/>
      <polygon points="0,-13 3.5,-3.5 13,0 3.5,3.5 0,13 -3.5,3.5 -13,0 -3.5,-3.5" transform="translate(24 -6)" fill="#000"/>
      <circle cx="54" cy="26" r="12" fill="#ffffff" stroke="#000" stroke-width="6"/>
      <circle cx="92" cy="40" r="27" fill="#e800a0" stroke="#000" stroke-width="5"/>
      <polygon points="0,-13 3.8,-4.2 12.4,-3.9 5.9,2.9 8.2,11.2 0,6.8 -8.2,11.2 -5.9,2.9 -12.4,-3.9 -3.8,-4.2" transform="translate(92 40)" fill="#ffffff"/>
    </g>

    <!-- the agent: suit, black sunglasses, fan of cash -->
    <g transform="translate(30 10)">
      <rect x="742" y="238" width="158" height="252" rx="26" fill="#111827"/>
      <path d="M796 238 h50 l-25 74 z" fill="#f8fafc"/>
      <path d="M815 258 h12 l-3 66 h-6 z" fill="#ff2ea6"/>
      <rect x="806" y="120" width="10" height="26" fill="#94a3b8"/>
      <circle cx="811" cy="112" r="9" fill="#ff2ea6"/>
      <rect x="748" y="168" width="14" height="34" rx="6" fill="#94a3b8"/>
      <rect x="880" y="168" width="14" height="34" rx="6" fill="#94a3b8"/>
      <circle cx="821" cy="182" r="60" fill="#d7dde8"/>
      <rect x="764" y="160" width="114" height="38" rx="17" fill="#000000"/>
      <path d="M776 172 l34 0 l-6 12 l-34 0 z" fill="#3f4756"/>
      <rect x="700" y="300" width="58" height="22" rx="11" fill="#d7dde8" transform="rotate(38 729 311)"/>
      <g>
        <rect x="636" y="300" width="66" height="34" rx="4" fill="#37e0a0" stroke="#0d7a4f" stroke-width="3" transform="rotate(-24 669 317)"/>
        <rect x="644" y="292" width="66" height="34" rx="4" fill="#4be584" stroke="#0d7a4f" stroke-width="3" transform="rotate(-6 677 309)"/>
        <rect x="652" y="288" width="66" height="34" rx="4" fill="#37e0a0" stroke="#0d7a4f" stroke-width="3" transform="rotate(12 685 305)"/>
        <text x="688" y="318" font-family="DejaVu Sans, Arial, sans-serif" font-weight="900" font-size="24" fill="#0d7a4f" transform="rotate(12 685 305)">$</text>
      </g>
      <rect x="884" y="300" width="58" height="22" rx="11" fill="#d7dde8" transform="rotate(-38 913 311)"/>
      <rect x="762" y="490" width="40" height="40" fill="#0b1120"/>
      <rect x="840" y="490" width="40" height="40" fill="#0b1120"/>
    </g>
  </svg>
  </div>

  <div class="cap cap-bot">
    <div class="l1">MY AGENT SPENT THEM</div>
    <div class="l2">EARNING ON</div>
    <div class="brand">make.fun</div>
  </div>
</body>
</html>
